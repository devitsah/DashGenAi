<div class="overlay">
  <div class="modal">
    <h4>Save Dashboard</h4>
    <div class="form-group">
      <label>Dashboard Name</label>
      <input type="text" [(ngModel)]="dashboard.name" placeholder="Dashboard Name" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea rows="3" [(ngModel)]="dashboard.description" placeholder="Enter dashboard description"></textarea>
    </div>
    <div class="button-group">
      <button class="primary" (click)="saveDashboard()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Dashboard' }}
      </button>
    </div>
  </div>
</div>
