<div class="overlay">

    <div class="dialog">

        <h2>Share Dashboard</h2>

        <p>Enter an email address.</p>

        <input
            type="email"
            [(ngModel)]="email"
            placeholder="name@example.com">

        <div class="buttons">

            <button (click)="share()">Share</button>

            <button (click)="cancel()">Cancel</button>

        </div>

    </div>

</div>
