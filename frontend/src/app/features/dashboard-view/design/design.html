<div class="dashboard-viewport" [ngClass]="'preset-' + currentPreset()">

  <div class="dashboard-top-panel">
    <div class="dashboard-top-panel-left">
      <div class="dashboard-logo">
        <i class="fa-solid fa-border-all"></i>
      </div>
      <div class="dashboard-content">
        <h2 class="dashboard-title">
          {{ dashboardTitle() }}
          <button type="button" class="icon-btn no-drag dashboard-rename-btn" title="Rename dashboard" (click)="Rename_Dashboard()">
            <i class="fa-solid fa-pen"></i>
          </button>
        </h2>
        <p class="dashboard-description">
          {{ dashboardDescription() }}
        </p>
      </div>
    </div>
   
    <button type="button" class="add-widget-btn no-drag" (click)="openAddWidget()">
      <i class="fa-solid fa-plus"></i> Add Widget
    </button>
  </div>

  <div class="grid-stack"></div>

</div>

<app-add-widget-dialog
  [open]="addWidgetOpen()"
  [dashboardId]="dashboardId"
  (closed)="onWidgetDialogClosed()"
  (created)="onWidgetCreated($event)"
></app-add-widget-dialog>

<ng-template #widgetTemplate let-w>
  <div class="custom-widget-card" [attr.data-widget-type]="w.type" [style.background]="currentPreset() === 'custom' && w.backgroundColor ? w.backgroundColor : null">

    <div class="widget-header" [style.background]="customHeaderBg(w)">
      <span class="widget-title" [style.color]="customTextColor(w)">{{ w.title }}</span>
      <span class="widget-header-actions no-drag"
            (mousedown)="$event.stopPropagation()"
            (touchstart)="$event.stopPropagation()"
            (pointerdown)="$event.stopPropagation()">
        <button type="button" class="icon-btn no-drag" title="Rename widget" (click)="Rename_Widget(w)">
          <i class="fa-solid fa-pen"></i>
        </button>
        <button type="button" class="icon-btn no-drag icon-btn-danger" title="Delete widget" (click)="Delete_Widget(w)">
          <i class="fa-solid fa-trash"></i>
        </button>
      </span>
      <span class="drag-handle-icon">⠿</span>
    </div>

    <div class="widget-body-viewport">
      <ng-container [ngSwitch]="w.type">

        <div *ngSwitchCase="'kpi'" class="kpi-display-box">
          <div class="kpi-main-value" [style.color]="customTextColor(w)">{{ kpiValue(w) }}</div>
          <div class="kpi-main-label" [style.color]="customTextColor(w)">{{ kpiLabel(w) }}</div>
        </div>

        <div *ngSwitchCase="'table'" class="table-display-box">
          <table class="rendered-ui-table">
            <thead>
              <tr><th *ngFor="let c of tableColumns(w)" [style.color]="customTextColor(w)" [style.background]="customHeaderBg(w)">{{ c }}</th></tr>
            </thead>
            <tbody>
              <tr *ngFor="let row of w.rows">
                <td *ngFor="let c of tableColumns(w)" [style.color]="customTextColor(w)">{{ row[c] }}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div *ngSwitchCase="'bar'" class="chart-container" [id]="'bar-' + w.id"></div>
        <div *ngSwitchCase="'pie'" class="chart-container" [id]="'pie-' + w.id"></div>
        <div *ngSwitchCase="'line'" class="chart-container" [id]="'line-' + w.id"></div>
        <div *ngSwitchCase="'area'" class="chart-container" [id]="'area-' + w.id"></div>
        <div *ngSwitchCase="'timeseries'" class="chart-container" [id]="'timeseries-' + w.id"></div>
        <div *ngSwitchCase="'gauge'" class="chart-container" [id]="'gauge-' + w.id"></div>
        <div *ngSwitchCase="'html'" class="html-widget-box no-drag" [innerHTML]="w.html"></div>

        <div *ngSwitchDefault class="unsupported-type-banner">Unknown widget type</div>

      </ng-container>
    </div>

    <div class="ai-metadata-footer" *ngIf="w.traceability">
      <span class="badge-trace-prompt" [style.color]="customTextColor(w)" [title]="w.traceability.sql">{{ w.traceability.prompt }}</span>
    </div>

  </div>
</ng-template>
