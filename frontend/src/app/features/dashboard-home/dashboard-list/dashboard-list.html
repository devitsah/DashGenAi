<div class="dashboard-container">

  <div class="action-bar">
    <div class="search-wrapper">
      <input
        type="text"
        placeholder="Search dashboards..."
        [(ngModel)]="searchText"
        (input)="onSearch()"
        class="search-input"
        aria-label="Filter dashboards"
      />
    </div>
  </div>

  <ng-container *ngIf="filteredCards$ | async as cards">

    <div class="loading-hint" *ngIf="loading">Loading dashboards…</div>

    <div class="dashboards-grid" *ngIf="!loading && cards.length > 0">
      <div class="dashboard-card" *ngFor="let card of cards">
        <div class="card-body">
          <div class="card-header">
            <h3 class="card-title" [title]="card.title">{{ card.title }}</h3>
            <span class="card-badge">{{ card.platform }}</span>
          </div>
          <p class="card-description">{{ card.description || 'No description' }}</p>
          <div class="card-metadata">
            <span>{{ card.widgets }} widget{{ card.widgets === 1 ? '' : 's' }}</span>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-preview" (click)="preview(card.dashboardId)">Preview</button>
          <div class="button-group">
            <button class="btn btn-icon" (click)="rename(card)" title="Rename">✎</button>
            <button class="btn btn-icon btn-icon-danger" (click)="delete(card)" title="Delete">🗑</button>
          </div>
        </div>
      </div>
    </div>

    <div class="zero-state" *ngIf="!loading && cards.length === 0">
      <span class="zero-state-icon">🗀</span>
      <p class="zero-state-text">No dashboards yet. Click <strong>New Dashboard</strong> to create one.</p>
    </div>

  </ng-container>

</div>
