<html lang="en">
<head>

  <title>StudyHub | Your Study Companion</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- PWA: installable "Add to Home Screen" support -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#4f6bff" />

  <!-- Android/Chrome install icon -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

  <!-- iOS "Add to Home Screen" support (Safari ignores the manifest) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudyHub" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
</head>
